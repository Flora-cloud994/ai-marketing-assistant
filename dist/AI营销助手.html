/* ---------- 痛点词典（中英双语） ----------
   顺序即优先级：先匹配具体问题，再匹配泛化的「质量差」。
   一条评论允许多类命中（「杯子裂了还漏水」= 质量 + 密封）。 */
const RV_PAIN = [
  ['物流破损', /(破损|压坏|包装|缺件|没收到|碎)/,
    /(damaged|broken in (transit|shipping)|arrived (broken|damaged|cracked)|dented box|missing (part|piece|pieces)|packaging (was|is) (bad|poor|thin))/i,
    '加固包装：改用蜂窝纸内衬 + 独立隔层，并在详情页写明「破损免举证补发」。'],

  ['售后 / 客服', /(客服|售后|退|保修|响应|订阅)/,
    /(customer service|no response|never (replied|heard back)|return|refund|warranty|support (was|is) (useless|terrible)|subscription)/i,
    '把售后变成卖点：首页固定「30 天无理由 + 12 个月换新」，并在包裹内放一张售后二维码卡片。'],

  ['漏水 / 密封', /(漏水|漏气|漏|密封|渗|卡扣|拉链)/,
    /(leak|leaked|leaking|spill|spilled|seal|gasket|not sealed|lid (does not|will not|would not) (seal|close)|zipper (split|broke|stuck))/i,
    '密封是最容易验证的差异点：拍「装满倒置 24 小时」实拍，并把密封圈做成可拆换耗材。'],

  ['续航 / 充电', /(续航|充电|电池|电量|充不进|断连)/,
    /(battery|charge|charging|will not charge|does not charge|dies (so |too )?(fast|quick)|lasts? only|run time|deflet|drain)/i,
    '用真实场景替代毫安时：标注「混合场景连续 X 杯 / X 天」，并把充电接口统一为 USB-C。'],

  ['清洗麻烦', /(清洗|难洗|洗后|残留|异味|味道|发霉|发臭)/,
    /(hard to clean|difficult to clean|cannot clean|impossible to clean|residue|mold|mould|smell|smelly|odor|odour|stuck (under|in)|gunk|scrub)/i,
    '把「好洗」拍成一个动作：加水、按一下、冲掉，10 秒内完成，做成主图第 2 张与短视频前三秒。'],

  ['噪音 / 发热', /(噪音|吵|声音|发热|烫)/,
    /(loud|noisy|overheat|too hot|hot to (the )?touch|screech|sounds like|humming)/i,
    '给可测量指标：实测分贝写进五点（≤62dB），并拍「清晨在婴儿房使用」的场景。'],

  ['尺寸 / 容量', /(容量|尺寸|太小|偏小|偏大|体积|占位|不合|偏重|重)/,
    /(too small|too big|smaller than|larger than|heavier than|bulky|does not fit|takes up|size chart)/i,
    '尺寸最容易退货：主图放「与常见物品同框」比例图，参数表逐项标注实测长宽高与克重。'],

  ['描述不符', /(不符|与描述|差距|说明|误|骗|色差|透)/,
    /(not as described|misleading|different from (the )?(picture|photo|description)|looks nothing like|colour|color (is|was) (off|different))/i,
    '落差来自过度修图：改用真实使用场景拍摄，色差控制在 ΔE<3，减少「收到就退」。'],

  ['效果不达标', /(打不碎|不转|没效果|无感|吸力不足|亮度衰减|掉色|不稳|掉档|卡|松脱|无效)/,
    /(does not work|did not work|not work|weak|not powerful|ineffective|useless|barely|no suction|will not blend|not strong enough|stopped spinning)/i,
    '把效果做成对比：同角度「用前/用后」+ 三组硬测试（冰块、冻果、坚果），比形容词有效十倍。'],

  ['质量 / 耐用', /(坏|烧|裂|断|生锈|松|掉漆|不耐用|质量|变形|塌|发黄|起球|勾丝|虚标)/,
    /(broke|broken|stopped working|died|dead|crack|cracked|snapped|fell apart|flimsy|cheap(ly)? (made|plastic)|rust|peel|chipped|bent|worn out|not durable|poor quality|shrank|pilling)/i,
    '把耐用做成可验证承诺：公开电机/结构测试次数，给 12 个月只换不修，第 4 张主图放内部结构实拍。']
];

const RV_STOP = new Set(`the and for with this that from have has had was were are is be been being it its it's my me our your their they them we you i a an of to in on at as or but not no so very really just too much more most can could would should will did do does done than then there here when what which who how all any some out up down off over after before again also about into only own same such if because while during both few other more most own too s t don now`.split(/\s+/).filter(Boolean));

/* ---------- 通用小工具 ---------- */
const RV_MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const pad2 = n => (n < 10 ? '0' : '') + n;

/* 日期 → YYYY-MM，支持 2026-08-14 / August 14, 2026 / 14 August 2026 / 8/14/2026 */
function rvDate(s) {
  const t = String(s || '').trim();
  if (!t) return '';
  let m = t.match(/(\d{4})[-\/](\d{1,2})(?:[-\/](\d{1,2}))?/);
  if (m) return m[1] + '-' + pad2(+m[2]);
  m = t.match(/([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})/);
  if (m) { const mo = RV_MON[m[1].slice(0, 3).toLowerCase()]; if (mo) return m[3] + '-' + pad2(mo); }
  m = t.match(/(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);
  if (m) { const mo = RV_MON[m[2].slice(0, 3).toLowerCase()]; if (mo) return m[3] + '-' + pad2(mo); }
  m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + pad2(+m[1]);
  m = t.match(/(\d{4})/);
  if (m) return m[1] + '-01';
  return '';
}

/* 星级解析："5.0 out of 5 stars" / "4" / "五星" / "" */
function rvStar(s) {
  const t = String(s || '');
  const m = t.match(/([1-5])(?:\.\d)?\s*(?:out of 5|星|\/5|stars?)/i) || t.match(/^\s*([1-5])(?:\.\d)?\s*$/);
  if (m) return +m[1];
  const n = parseFloat(t.replace(/[^\d.]/g, ''));
  return n >= 1 && n <= 5 ? Math.round(n) : 0;
}

function rvClassify(text) {
  const s = String(text || '');
  const hit = [];
  for (const [k, cn, en] of RV_PAIN) if (cn.test(s) || en.test(s)) hit.push(k);
  return hit;
}

function rvNorm(x) {
  return { prod: String(x.prod || x.asin || '').trim(), rating: rvStar(x.rating), date: rvDate(x.date), title: String(x.title || '').trim(), body: String(x.body || '').trim(), verified: x.verified, helpful: +x.helpful || 0 };
}

/* ---------- CSV 解析（支持引号内逗号与换行） ---------- */
function rvCSV(text) {
  const src = String(text || '').replace(/^\ufeff/, '');
  const head = (src.split(/\r?\n/)[0] || '');
  const delim = (head.split('\t').length > head.split(',').length) ? '\t' : (head.split(';').length > head.split(',').length ? ';' : ',');
  const rows = [];
  let row = [], cur = '', q = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}

const RV_COL = [
  [['rating', 'stars', 'star', 'score', '星级', '评分'], 'rating'],
  [['title', 'headline', 'summary', '标题'], 'title'],
  [['body', 'review', 'content', 'text', 'reviewbody', 'review_text', '评论', '内容', '正文'], 'body'],
  [['date', 'review_date', 'reviewdate', 'time', '日期', '时间'], 'date'],
  [['asin', 'product', 'product_name', 'productname', 'sku', 'title_asin', '产品', '商品'], 'prod'],
  [['verified', 'verified_purchase', 'verifiedpurchase', '已验证'], 'verified'],
  [['helpful', 'votes', 'helpful_votes', '有用'], 'helpful']
];

function rvMapCols(header) {
  const hs = header.map(h => String(h || '').trim().toLowerCase().replace(/\s+/g, '_'));
  const map = {};
  RV_COL.forEach(([names, key]) => {
    let idx = hs.findIndex(h => names.indexOf(h) > -1);
    if (idx < 0) idx = hs.findIndex(h => names.some(n => n.length > 3 && h.indexOf(n) > -1));
    if (idx > -1) map[key] = idx;
  });
  return map;
}

function rvFromCSV(text) {
  const rows = rvCSV(text);
  if (!rows.length) return { items: [], note: '文件是空的' };
  const map = rvMapCols(rows[0]);
  const hasHeader = !!(map.body || map.rating);
  const body = hasHeader ? rows.slice(1) : rows;
  if (!map.body && !map.title) {
    /* 没有可识别的正文列：退化为「每行一条评论」 */
    const items = rows.map(r => rvNorm({ body: r.join(' ') })).filter(x => x.body.length > 8);
    return { items, note: items.length ? '未识别到标准列名，已按「每行一条评论」读取' : '没读到有效内容' };
  }
  const items = body.map(r => {
    const o = {};
    for (const k in map) o[k] = r[map[k]];
    const it = rvNorm(o);
    if (!it.body && it.title) it.body = it.title;
    return it;
  }).filter(x => (x.body || x.title) && (x.body.length + x.title.length) > 6);
  return { items, note: hasHeader ? '' : '未检测到表头，已按位置读取' };
}

/* ---------- 粘贴文本解析 ----------
   兼容两种常见形态：
   A) Amazon 页面复制：星级行 + "Reviewed in ... on August 14, 2026" + 标题 + 正文（空行分隔）
   B) 管道行：5|2026-08-14|标题|正文|产品名                        */
function rvFromText(text) {
  const src = String(text || '').trim();
  if (!src) return { items: [], note: '没有内容' };
  const lines = src.split(/\r?\n/);
  const pipe = lines.filter(l => (l.match(/\|/g) || []).length >= 2);
  if (pipe.length >= Math.max(2, lines.length * .5)) {
    const items = [];
    pipe.forEach(l => {
      const p = l.split('|').map(s => s.trim());
      const si = p.findIndex(x => /^[1-5](\.\d)?$/.test(x));
      const di = p.findIndex(x => /\d{4}/.test(x) && /[-/年月]/.test(x));
      const rating = si > -1 ? rvStar(p[si]) : 0;
      const date = di > -1 ? rvDate(p[di]) : '';
      const rest = p.filter((x, i) => i !== si && i !== di && x);
      const o = { rating, date, body: rest.join(' ') };
      if (rest.length > 1) { o.title = rest[0]; o.body = rest.slice(1).join(' '); }
      const it = rvNorm(o);
      if (it.body || it.title) items.push(it);
    });
    return { items, note: '按管道分隔读取' };
  }

  const blocks = src.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const items = [];
  blocks.forEach(b => {
    const bm = b.match(/([1-5])(?:\.\d)?\s*out of 5\s*stars?/i) || b.match(/([1-5])\s*星/);
    const dm = b.match(/on\s+([A-Za-z]{3,9}\s+\d{1,2},\s+\d{4})/) || b.match(/(\d{4}-\d{1,2}(?:-\d{1,2})?)/) || b.match(/([A-Za-z]{3,9}\s+\d{1,2},\s+\d{4})/);
    const ls = b.split(/\r?\n/).map(x => x.replace(/^\s*[›>·•-]\s*/, '').trim())
      .filter(x => x && !/out of 5\s*stars?/i.test(x) && !/^Reviewed in/i.test(x) && !/helpful|report|verified purchase/i.test(x));
    if (!ls.length) return;
    const it = rvNorm({ rating: bm ? +bm[1] : 0, date: dm ? dm[1] : '', title: ls[0].length < 90 ? ls[0] : '', body: (ls[0].length < 90 ? ls.slice(1) : ls).join(' ') });
    if ((it.body || it.title).length > 8) items.push(it);
  });
  if (items.length) return { items, note: '按空行分段读取' };
  const one = src.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 10).map(s => rvNorm({ body: s }));
  return { items: one, note: '按每行一条读取' };
}

/* ---------- 取数据：真实导入优先，否则内置样本 ---------- */
function rvItems(ctx) {
  const u = ctx.__reviews;
  if (u && u.items && u.items.length >= 2) {
    return { items: u.items.map(rvNorm), source: 'user', at: u.at || '', name: u.name || '' };
  }
  const cat = (ctx.category || '').trim();
  const raw = RV[cat] || RV['厨房小家电'];
  const items = raw.map((x, i) => rvNorm({
    prod: x[0], rating: x[1], date: x[2], title: x[3], body: x[4],
    verified: i % 7 !== 0, helpful: (i * 7) % 23
  }));
  return { items, source: 'sample', at: '', name: cat + ' · 头部 6 款' };
}

/* ---------- 统计 ---------- */
function rvAnalyze(items) {
  const n = items.length;
  const dist = [0, 0, 0, 0, 0];
  let sum = 0, rated = 0, verified = 0, verifiable = 0, helpful = 0;
  const painMap = {};
  const wordMap = {};
  const monthMap = {};
  const prodMap = {};
  const usedQ = {};   /* 同一条原话只在一个痛点下出现，避免跨类重复 */

  items.forEach(it => {
    const r = it.rating;
    if (r >= 1 && r <= 5) { dist[r - 1]++; sum += r; rated++; }
    if (it.verified === true || it.verified === 'true' || it.verified === 'Y' || it.verified === 'y' || it.verified === '1') { verified++; verifiable++; }
    else if (it.verified === false || it.verified === 'false' || it.verified === 'N' || it.verified === 'n' || it.verified === '0') verifiable++;
    helpful += it.helpful || 0;

    const text = (it.title + ' ' + it.body);
    /* 只把 ≤3 星的内容算作痛点来源，避免好评里的「不漏水」被误判 */
    if (r >= 4) return;
    const hits = rvClassify(text);
    hits.forEach(k => {
      if (!painMap[k]) painMap[k] = { count: 0, quotes: [] };
      painMap[k].count++;
      if (painMap[k].quotes.length < 2 && it.body.length > 40 && !usedQ[it.body]) {
        painMap[k].quotes.push({ t: it.body, r, p: it.prod });
        usedQ[it.body] = 1;
      }
    });

    const key = it.prod || '未标注产品';
    if (!prodMap[key]) prodMap[key] = { name: key, n: 0, neg: 0, sum: 0, rated: 0, pains: {} };
    hits.forEach(k => { prodMap[key].pains[k] = (prodMap[key].pains[k] || 0) + 1; });
  });

  /* 月度趋势 */
  items.forEach(it => {
    if (!it.date) return;
    const ym = it.date;
    if (!monthMap[ym]) monthMap[ym] = { ym, n: 0, sum: 0, rated: 0 };
    monthMap[ym].n++;
    if (it.rating) { monthMap[ym].sum += it.rating; monthMap[ym].rated++; }
  });

  /* 产品维度：总条数、差评条数、均分 */
  items.forEach(it => {
    const key = it.prod || '未标注产品';
    if (!prodMap[key]) prodMap[key] = { name: key, n: 0, neg: 0, sum: 0, rated: 0, pains: {} };
    const p = prodMap[key];
    p.n++;
    if (it.rating && it.rating <= 2) p.neg++;
    if (it.rating) { p.sum += it.rating; p.rated++; }
  });

  /* 高频词 */
  items.forEach(it => {
    if (it.rating >= 4) return;
    const ws = (it.title + ' ' + it.body).toLowerCase().match(/[a-z][a-z'-]{2,}/g) || [];
    ws.forEach(w => {
      const t = w.replace(/'s$/, '').replace(/(ing|ed|es|s)$/, '');
      if (t.length < 4 || RV_STOP.has(t) || RV_STOP.has(w)) return;
      wordMap[t] = (wordMap[t] || 0) + 1;
    });
  });

  const neg = dist[0] + dist[1];
  const pos = dist[3] + dist[4];
  const pains = Object.entries(painMap)
    .map(([k, v]) => ({ k, count: v.count, quotes: v.quotes, share: neg ? v.count / neg : 0 }))
    .sort((a, b) => b.count - a.count);
  const words = Object.entries(wordMap).map(([w, c]) => ({ w, c })).filter(x => x.c > 1).sort((a, b) => b.c - a.c).slice(0, 20);
  const months = Object.values(monthMap).sort((a, b) => a.ym < b.ym ? -1 : 1);
  const prods = Object.values(prodMap).map(p => Object.assign({}, p, {
    avg: p.rated ? p.sum / p.rated : 0,
    negRate: p.n ? p.neg / p.n : 0,
    topPain: Object.entries(p.pains).sort((a, b) => b[1] - a[1])[0]
  })).sort((a, b) => b.neg - a.neg);

  return {
    n, dist, rated, neg, pos,
    avg: rated ? sum / rated : 0,
    negRate: rated ? neg / rated : 0,
    posRate: rated ? pos / rated : 0,
    verified, verifiable, verifiedRate: verifiable ? verified / verifiable : 0,
    helpful, pains, words, months, prods,
    hasDate: months.length > 0,
    span: months.length ? months[0].ym.replace('-', '.') + ' – ' + months[months.length - 1].ym.replace('-', '.') : ''
  };
}

/* ---------- 渲染 ---------- */
function rvStars(r) {
  const full = Math.round(r);
  return '★'.repeat(full) + '☆'.repeat(5 - full);
}

function rvMonthsSvg(months, W) {
  const w = W || 640, h = 190, padL = 34, padR = 8, padT = 14, padB = 30;
  const dat = months.slice(-12);
  if (!dat.length) return '';
  const max = Math.max.apply(null, dat.map(d => d.n)) || 1;
  const iw = w - padL - padR, ih = h - padT - padB;
  const step = iw / dat.length;
  const bw = Math.max(8, step * .52);
  let s = `<svg class="msvg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="按月评论量趋势">`;
  s += `<line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#dfe5ef" stroke-width="1"/>`;
  [0, .5, 1].forEach(t => {
    const y = padT + ih - ih * t;
    s += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#eef2f8" stroke-width="1"/>`;
    s += `<text x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8b95a3">${Math.round(max * t)}</text>`;
  });
  dat.forEach((d, i) => {
    const bh = Math.max(2, d.n / max * ih);
    const x = padL + step * i + (step - bw) / 2;
    const y = padT + ih - bh;
    const tone = d.n === max ? '#1e4fd8' : '#b9c8e8';
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${tone}"/>`;
    if (dat.length <= 14) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${h - padB + 14}" text-anchor="middle" font-size="9.5" fill="#8b95a3">${d.ym.slice(5)}</text>`;
  });
  s += `<text x="${padL}" y="${h - 4}" font-size="9.5" fill="#8b95a3">按月评论量（${dat[0].ym} 起，最近 ${dat.length} 个月）</text>`;
  return s + '</svg>';
}

function reviewSection(ctx, rva, meta, n) {
  const src = meta.source === 'user';
  const badge = src
    ? `<span class="rvtg ok">真实数据</span>已导入 ${rva.n} 条${meta.name ? ' · ' + esc(meta.name) : ''}`
    : `<span class="rvtg">内置样本</span>${rva.n} 条 · ${esc(meta.name)}`;

  /* 星级环形：5→1 由绿到红 */
  const dist = [5, 4, 3, 2, 1].map(st => {
    const c = rva.dist[st - 1] || 0;
    const col = st >= 4 ? '#0e9f6e' : st === 3 ? '#f0b429' : (st === 2 ? '#ef8a3c' : '#dc2626');
    return { v: c, c: col, k: st + ' 星', n: c };
  });
  const starLegend = dist.map(d => `<span><i style="background:${d.c}"></i>${d.k} ${pct(rva.n ? d.n / rva.n : 0)}</span>`).join('');

  /* 痛点条形 */
  const pains = rva.pains.slice(0, 6);
  const pmax = Math.max.apply(null, pains.map(p => p.count).concat([1]));
  const painRows = pains.map(p => ({
    k: p.k, v: p.count,
    t: rva.neg ? `${p.count} 条 · ${pct(p.share)}` : `${p.count} 条`,
    c: p.count === pmax ? VZ.red : VZ.blue
  }));
  const topPain = pains[0];
  const topQuote = topPain && topPain.quotes && topPain.quotes[0];

  const worst = rva.prods.filter(p => p.n >= 2)[0];
  const words = rva.words.length
    ? rva.words.slice(0, 18).map(w => `<span class="wtag">${esc(w.w)}<b>${w.c}</b></span>`).join('')
    : '<span class="sub2">评论量不足或为非英文内容，词频从略。</span>';

  const fixes = pains.slice(0, 3).map((p, i) => `
    <div class="fix3-i">
      <div class="fix3-h"><b>${i + 1}. ${esc(p.k)}</b><span>${p.count} 条 · ${rva.neg ? pct(p.share) : '—'}</span></div>
      <p>${PAIN_FIX[p.k] || '把这一项做成可验证的承诺，并用实拍证明。'}</p>
    </div>`).join('');

  return `
    <section class="ch" id="ch${n}">
      <h2><i>第${['一','二','三','四','五','六','七','八','九'][n - 1]}章</i>评论与需求缺口</h2>
      <div class="rvinfo">
        <div class="rvsrc">${badge}${rva.span ? ' · 覆盖 ' + rva.span : ''}</div>
        <div class="rvhint">${src
      ? `结论全部由导入的评论重算，换数据整章自动更新。${rva.n < 20 ? '　当前仅 ' + rva.n + ' 条，占比易失真，建议抓到 50 条以上。' : ''}`
      : '样本按该品类头部产品分布重写，用于跑通分析链路；导入真实评论后整章替换。样本刻意放大了差评密度（真实头部通常 4.2–4.5 分、差评率 8–15%），不要拿这里星级的绝对值下结论。'}</div>
      </div>

      <div class="revtop">
        <div class="revtop-g">
          ${vizDonut(dist, { v: pct(rva.negRate), l: '差评率（≤2 星）', c: rva.negRate > .3 ? VZ.red : VZ.ink })}
          <div class="revleg">${starLegend}</div>
        </div>
        <div class="revtop-t">
          <div class="cstat">
            <div><b>${rva.n}</b><span>评论条数</span></div>
            <div><b>${rva.avg ? rva.avg.toFixed(2) : '—'}</b><span>平均星级</span></div>
            <div><b>${rva.neg}</b><span>差评条数</span></div>
          </div>
          <p class="gcell-f">差评率是选品第一道过滤器：高于 30% 说明现有玩家普遍做不好，是机会；低于 8% 说明体验已被做满，只能拼价格与内容。${src ? '' : '（此处为样本值。）'}</p>
          ${rva.hasDate ? rvMonthsSvg(rva.months) : ''}
        </div>
      </div>

      <h3>差评痛点：${rva.neg} 条差评拆出 ${rva.pains.length} 类问题${rva.pains.length > 6 ? '（列前 6 类）' : ''}</h3>
      ${vizHbar(painRows, { max: pmax, rh: 27, nameW: 118, showVal: true })}
      ${topQuote ? `<div class="qbox"><i>“${esc(topQuote.t.length > 160 ? topQuote.t.slice(0, 160) + '…' : topQuote.t)}”</i><span>${esc(topQuote.p)} · ${topQuote.r} 星</span></div>` : ''}
      <p class="pnote">一条评论可命中多类（「杯子裂了还漏水」＝ 质量 + 密封），占比之和会大于 100%。</p>

      <h3>Top 3 缺口 → 怎么改成卖点</h3>
      <div class="fix3">${fixes}</div>
      ${worst ? `<p class="pconcl">最该被接走的是「${esc(worst.name)}」的用户：${worst.neg} 条差评、占其评论 ${pct(worst.negRate)}，把他们的原话逐条做成对比素材，比凭空讲卖点有效。</p>` : ''}

      <h3>差评高频词</h3>
      <div class="wcloud">${words}</div>
      <p class="pnote">只统计 ≤3 星评论并剔除停用词。这些词是用户的原生语言，可直接搬进广告痛点段与 FAQ 标题。</p>
    </section>`;
}

</script>
<script>
/* =========================================================
   compete.js — 竞品深度分析：集中度 / 价格带 / 四象限 / 威胁矩阵
   输入为 doc.js 的 HOT 样本（[名称,品牌,价格,评分,评论数,月销,卖点,差评]）
   ========================================================= */

/* 集中度：HHI 与 CR3，用评论存量代表市场份额（评论≈累计销量代理） */
function compIndex(list) {
  const total = list.reduce((a, p) => a + p[4], 0) || 1;
  const shares = list.map(p => p[4] / total).sort((a, b) => b - a);
  const hhi = Math.round(shares.reduce((a, s) => a + s * s, 0) * 10000);
  const cr3 = shares.slice(0, 3).reduce((a, s) => a + s, 0);
  const cr1 = shares[0];
  let tone, label;
  if (hhi > 3200) { tone = 'bad'; label = '高度集中'; }
  else if (hhi > 2000) { tone = 'mid'; label = '中度集中'; }
  else { tone = 'good'; label = '相对分散'; }
  return { hhi, cr1, cr3, label, tone, shares };
}

/* 价格带：等宽 5 档（浮点切分，避免最后一档区间反转），返回每档款数 */
function priceBands(list, sym) {
  const ps = list.map(p => p[2]).sort((a, b) => a - b);
  const lo = Math.floor(ps[0]), hi = Math.ceil(ps[ps.length - 1]);
  const step = (hi - lo) / 5 || 1;
  const bands = [];
  for (let i = 0; i < 5; i++) {
    const a = lo + step * i, b = lo + step * (i + 1);
    const items = list.filter(p => p[2] >= a && (i === 4 ? p[2] <= b + .001 : p[2] < b));
    bands.push({ a: Math.round(a), b: Math.round(b), n: items.length, items });
  }
  const med = ps.length % 2 ? ps[(ps.length - 1) / 2] : (ps[ps.length / 2 - 1] + ps[ps.length / 2]) / 2;
  return { bands, lo, hi, step, med, ps };
}

function priceBandSvg(pb, sym) {
  const W = 640, H = 232, padL = 10, padR = 10, padT = 18, padB = 54;
  const max = Math.max.apply(null, pb.bands.map(b => b.n)) || 1;
  const iw = W - padL - padR, ih = H - padT - padB;
  const step = iw / 5, bw = step * .46;
  let s = `<svg class="msvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="价格带分布">`;
  s += `<line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="#dfe5ef"/>`;
  pb.bands.forEach((b, i) => {
    const x = padL + step * i + (step - bw) / 2;
    const bh = b.n ? Math.max(10, b.n / max * ih) : 0;
    const y = padT + ih - bh;
    if (b.n) {
      const tone = b.n === max ? '#1e4fd8' : '#b9c8e8';
      s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${tone}"/>`;
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 7).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4fd8">${b.n}</text>`;
    } else {
      s += `<rect x="${x.toFixed(1)}" y="${(padT + ih - 26).toFixed(1)}" width="${bw.toFixed(1)}" height="26" rx="4" fill="#fff" stroke="#d94a3d" stroke-dasharray="4 3"/>`;
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(padT + ih - 8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#d94a3d">空档</text>`;
    }
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 17}" text-anchor="middle" font-size="10" fill="#5b6675">${sym}${b.a}</text>`;
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - padB + 30}" text-anchor="middle" font-size="9" fill="#98a2b3">–${sym}${b.b}</text>`;
  });
  /* 中位线 */
  const medBand = clamp(Math.floor((pb.med - pb.lo) / (pb.step || 1)), 0, 4);
  const mx = padL + step * medBand + step / 2;
  s += `<line x1="${mx.toFixed(1)}" y1="${padT - 4}" x2="${mx.toFixed(1)}" y2="${(H - padB).toFixed(1)}" stroke="#f0a020" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  s += `<text x="${mx.toFixed(1)}" y="${padT - 8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b8730a">中位 ${sym}${pb.med}</text>`;
  s += `<text x="${padL}" y="${H - 7}" font-size="9.5" fill="#8b95a3">横轴为价格带，柱高为该价位在售款数；红色虚线框为无人占据的空档</text>`;
  return s + '</svg>';
}

/* 四象限：x = 评论存量（对数），y = 评分，圆面积 = 月销 */
function quadSvg(list, sym) {
  const W = 640, H = 330, padL = 46, padR = 28, padT = 26, padB = 44;
  const iw = W - padL - padR, ih = H - padT - padB;
  const xs = list.map(p => Math.log10(Math.max(100, p[4])));
  const xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
  const ys = list.map(p => p[3]);
  const ymin = Math.min.apply(null, ys) - .08, ymax = Math.max.apply(null, ys) + .08;
  const maxS = Math.max.apply(null, list.map(p => p[5]));
  const X = v => { const t = (Math.log10(Math.max(100, v)) - xmin) / ((xmax - xmin) || 1); return padL + iw * (.09 + .82 * t); };
  const Y = v => { const t = (v - ymin) / ((ymax - ymin) || 1); return padT + ih * (.92 - .84 * t); };
  const mx = padL + iw * .5, my = padT + ih * .5;

  let s = `<svg class="msvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="评论存量与评分四象限">`;
  s += `<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" rx="6" fill="#fafbfe"/>`;
  s += `<line x1="${mx}" y1="${padT}" x2="${mx}" y2="${padT + ih}" stroke="#d5dded" stroke-dasharray="4 4"/>`;
  s += `<line x1="${padL}" y1="${my}" x2="${padL + iw}" y2="${my}" stroke="#d5dded" stroke-dasharray="4 4"/>`;

  /* 四角短标签，避免压住气泡 */
  const qs = [
    ['守擂区', padL + 8, padT + 15, 'start'],
    ['潜力区', padL + iw - 8, padT + 15, 'end'],
    ['可攻击区', padL + 8, padT + ih - 9, 'start'],
    ['淘汰区', padL + iw - 8, padT + ih - 9, 'end']
  ];
  qs.forEach(([t, x, y, an]) => {
    s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${an}" font-size="10" font-weight="700" fill="#9aa5b5">${t}</text>`;
  });

  /* y 轴刻度 */
  for (let i = 0; i <= 2; i++) {
    const v = ymin + (ymax - ymin) * i / 2;
    const y = Y(v);
    s += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${padL + iw}" y2="${y.toFixed(1)}" stroke="#edf1f8"/>`;
    s += `<text x="${padL - 7}" y="${(y + 3.4).toFixed(1)}" text-anchor="end" font-size="9" fill="#98a2b3">${v.toFixed(2)}</text>`;
  }

  list.forEach(p => {
    const cx = X(p[4]), cy = Y(p[3]);
    const r = 6 + Math.sqrt(Math.max(0, p[5]) / maxS) * 13;
    const weak = p[3] < 4.35;
    s += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${weak ? '#d94a3d' : '#1e4fd8'}" fill-opacity=".14" stroke="${weak ? '#d94a3d' : '#1e4fd8'}" stroke-width="1.3"/>`;
  });

  /* 标签后画：大圆内嵌，小圆按「上方 → 右上 → 下方 → 左上」找空位，
     同时避开其他标签与其他气泡（否则会压在别人的圆上） */
  const placed = [];
  const circles = list.map(p => ({
    x: X(p[4]), y: Y(p[3]),
    r: 6 + Math.sqrt(Math.max(0, p[5]) / maxS) * 13
  }));
  list.forEach((p, pi) => {
    const cx = X(p[4]), cy = Y(p[3]);
    const r = circles[pi].r;
    const weak = p[3] < 4.35;
    const nm = String(p[1]).slice(0, 10);
    const w = nm.length * 4.5;

    if (r >= 15) {
      placed.push({ x: cx, y: cy + 2.6, w });
      s += `<text x="${cx.toFixed(1)}" y="${(cy + 2.6).toFixed(1)}" text-anchor="middle" font-size="7.8" font-weight="700" fill="${weak ? '#a83226' : '#173a9c'}">${esc(nm)}</text>`;
      return;
    }

    const cands = [
      { x: cx, y: cy - r - 4, an: 'middle' },
      { x: cx + r + 4, y: cy - r + 2, an: 'start' },
      { x: cx, y: cy + r + 11, an: 'middle' },
      { x: cx - r - 4, y: cy - r + 2, an: 'end' }
    ];
    let use = null;
    for (const c of cands) {
      const cxp = c.an === 'middle' ? c.x : (c.an === 'start' ? c.x + w / 2 : c.x - w / 2);
      const hitLabel = placed.some(L => Math.abs(L.y - c.y) < 9 && Math.abs(L.x - cxp) < (L.w + w) / 2 + 4);
      const hitCircle = circles.some((C, ci) => {
        if (ci === pi) return false;
        return Math.abs(C.x - cxp) < C.r + w / 2 + 2 && Math.abs(C.y - c.y) < C.r + 5;
      });
      if (!hitLabel && !hitCircle) { use = { x: c.x, y: c.y, an: c.an, cx: cxp }; break; }
    }
    if (!use) use = { x: cx, y: cy + 2.6, an: 'middle', cx };
    placed.push({ x: use.cx, y: use.y, w });
    s += `<text x="${use.x.toFixed(1)}" y="${use.y.toFixed(1)}" text-anchor="${use.an}" font-size="7.8" font-weight="700" fill="${weak ? '#a83226' : '#173a9c'}">${esc(nm)}</text>`;
  });

  /* 坐标轴 */
  s += `<line x1="${padL}" y1="${padT + ih}" x2="${padL + iw}" y2="${padT + ih}" stroke="#c9d3e3"/>`;
  s += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + ih}" stroke="#c9d3e3"/>`;
  s += `<text x="${padL + iw / 2}" y="${H - 10}" text-anchor="middle" font-size="9.5" fill="#8b95a3">评论存量（对数刻度）→</text>`;
  s += `<text x="10" y="${padT - 8}" font-size="9.5" fill="#8b95a3">评分 ↑</text>`;
  s += `<text x="${padL + iw}" y="${padT - 8}" text-anchor="end" font-size="9" fill="#aab4c2">圆面积 = 月销</text>`;
  return s + '</svg>';
}

/* 威胁矩阵：谁最该被绕开 */
function threats(list) {
  const prices = list.map(p => p[2]);
  const pmin = Math.min.apply(null, prices), pmax = Math.max.apply(null, prices);
  const maxRev = Math.max.apply(null, list.map(p => p[4]));
  return list.map(p => {
    const moat = Math.round(p[4] / maxRev * 100);
    const health = Math.round(clamp((p[3] - 3.9) / 1.1, 0, 1) * 100);
    const cheap = Math.round(clamp(1 - (p[2] - pmin) / (pmax - pmin || 1), 0, 1) * 100);
    const price = Math.round(clamp(1 - (p[2] - pmin) / (pmax - pmin || 1), 0, 1) * 100);
    const threat = Math.round(moat * .42 + health * .33 + price * .25);
    return { p, moat, health, cheap, threat };
  }).sort((a, b) => b.threat - a.threat);
}

/* ---------- 第二章：品类与形态（先定格子，不看对手） ---------- */
function catSection(ctx, n, extra) {
  const hasCat = !!(ctx.category || '').trim();
  const S = hasCat && typeof subRows === 'function' ? subRows(ctx) : null;
  return `
  <section class="ch" id="ch${n}">
    <h2><i>第${['一','二','三','四','五','六','七','八','九'][n - 1]}章</i>品类与形态细分</h2>
    ${hasCat
      ? `<p class="plead">${S
        ? `词抓完了，第二步是<b>给这个词定格子</b>：大类 › 款式 › 功能。同一个搜索词底下，这 ${S.n} 款会挤在一页结果里互相抢点击 —— 你的对手是同一格里的那几款，不是整个大类。`
        : `第二步是<b>把货归到格子里</b>（形态）。格子站错了，后面的五维、价格带、四象限看的全是别人的战场。`}</p>`
      : `<p class="plead">品类还没定，下面是跨类目通用样本的形状。<b>定完品类这一章才有意义</b>：同样叫「支架」，车载、桌面、床头是三个战场，对手、价格、搜索词全都不一样。</p>`}

    ${subSection(ctx) || formMapSection(ctx)}
    ${extra || ''}

    <p class="pconcl">${S
      ? `格子画完才轮到算对手。下一章只看<b>「${esc(S.cur.zh)}」这一格</b>里的人：同款不同价、同价不同款，都是直接对手。`
      : `格子画完才轮到算对手。下一章看的是同一形态里的头部产品：谁把首屏锁死了，谁在漏人。`}</p>
  </section>`;
}

/* ---------- 第三章：竞品分析（只看同一格里的对手） ---------- */
function compSection(ctx, list, st, n, notice) {
  const sym = mkOf(ctx.market).sym;
  const ci = compIndex(list);
  const pb = priceBands(list, sym);
  const th = threats(list);
  const sc = hotScore(list, st, ctx);
  const empty = pb.bands.filter(b => b.n === 0);
  const dense = pb.bands.slice().sort((a, b) => b.n - a.n)[0];
  const top = th[0];
  const weakest = list.find(p => p[3] === Math.min.apply(null, list.map(x => x[3]))) || list[list.length - 1];
  const parts = [
    { k: '需求强度', v: sc.demand }, { k: '竞争友好', v: sc.comp }, { k: '利润空间', v: sc.profit },
    { k: '差异空间', v: sc.diff }, { k: '内容可拍', v: sc.content }
  ];
  const low = parts.slice().sort((a, b) => a.v - b.v)[0];

  const thRows = th.slice(0, 5).map(t => ({
    k: t.p[1], v: t.threat, t: String(t.threat),
    c: t.threat > 62 ? VZ.red : t.threat > 44 ? VZ.amber : VZ.blue,
    s: `${sym}${t.p[2]} · ${(t.p[4] / 1000).toFixed(1)}k 评论 · 护城河 ${t.moat}`
  }));

  const chips = list.map(p => `<span class="clist-i">${esc(p[1])}<i>${sym}${p[2]}</i><a class="lk" href="https://www.amazon.com/s?k=${encodeURIComponent(p[1] + ' ' + (catOf(ctx.category).kw[0] || ''))}" target="_blank" rel="noopener">核实</a></span>`).join('');

  return `
  <section class="ch" id="ch${n}">
    <h2><i>第${['一','二','三','四','五','六','七','八','九'][n - 1]}章</i>竞品分析</h2>
    <p class="plead">格子定完了，这一章只回答一件事：<b>这一格里已经站着谁，你挤得进去吗</b>。四个角度看同一件事 —— 五维看短板、集中度看首屏锁得多死、价格带看钱挤在哪、四象限看谁在漏人。</p>
    ${notice || ''}

    <div class="grid2">
      <div class="gcell">
        <div class="gcell-h">五维评分 · 短板决定成败</div>
        ${vizRadar(parts)}
        <p class="gcell-f">最低项是<b>${low.k}</b>（${low.v}/10），它决定这一单能不能成，平均分好看没有意义。</p>
      </div>
      <div class="gcell">
        <div class="gcell-h">集中度 · 首屏锁得多死</div>
        <div class="cstat">
          <div><b>${ci.hhi}</b><span>HHI${ci.hhi > 3200 ? ' · 高度集中' : ci.hhi > 2000 ? ' · 中度' : ' · 分散'}</span></div>
          <div><b>${pct(ci.cr3)}</b><span>CR3 前三份额</span></div>
          <div><b>${pct(ci.cr1)}</b><span>第一名独占</span></div>
        </div>
        <p class="gcell-f">第一名用 ${(list[0][4] / 1000).toFixed(0)}k 条评论换来的首屏，等于新店 12–18 个月的自然积累，正面拼量没有胜算。</p>
        <div class="gcell-h" style="margin-top:10px">评价体量分层 · 壁垒有多厚</div>
        ${structBlock(list, st)}
      </div>
    </div>

    <h3>价格带：钱挤在哪，空在哪</h3>
    ${priceBandSvg(pb, sym)}
    <p class="pnote">最密档位 ${sym}${dense.a}–${sym}${dense.b}（${dense.n} 款在售）；${empty.length
      ? `空档 ${empty.map(b => sym + b.a + '–' + sym + b.b).join('、')} 要先确认是「没人想到」还是「做了卖不动」。`
      : '没有完全空档，每个价位都有人卡位，只能靠差异点切入。'}</p>

    <h3>评论存量 × 评分：谁在漏人</h3>
    ${quadSvg(list, sym)}
    <p class="pnote">左下「可攻击区」＝有量但体验差，是首选切入点。样本里最典型的是「${esc(weakest[0])}」：${weakest[3].toFixed(1)} 分、${(weakest[4] / 1000).toFixed(1)}k 条评论——它的差评就是你的广告文案。</p>

    <h3>威胁榜：先绕开谁</h3>
    ${vizHbar(thRows, { max: 100, unit: ' 分', rh: 30 })}
    <p class="pnote">威胁 = 评论护城河 42% + 评分健康 33% + 价格杀伤 25%。看的是「追平它要多久」，不是「它现在多强」。</p>

    <div class="clist">${chips}</div>
    <p class="pconcl">站位只有一句：绕开「${esc(top.p[0])}」，对标「${esc(weakest[0])}」，价格落在 ${sym}${Math.round(pb.med * .82)}–${sym}${Math.round(pb.med * 1.05)}——低于中位形成价差，高于白牌保住毛利。<b>下面两步是验证：这些人的评论里，用户到底在骂什么。</b></p>
  </section>`;
}

</script>
<script>
/* =========================================================
   select.js — 选品决策层（把「调研」变成「放行 / 不放行」）
   ① 产品地图：同一类目下有哪些形态，本品站在哪一格
   ② 结构指标：头部评价体量分层（竞争是量的问题还是质的问题）
   ③ 四关放行：需求 / 竞争 / 利润 / 风险，短板一票
   ④ 风险闸门：认证、专利、侵权、退货，过不了就别投钱
   ========================================================= */

/* ---------- ① 产品地图 ---------- */
/* 先细分，再比价。
   认出「背带裤」之后，再列同品类里的连衣裙、T恤、鞋就是废话——那是别人的生意，
   不做同一批搜索词。真正抢同一批点击的是「背带裤」内部的款式差异（牛仔/工装/阔腿/
   孕妇/大码），再往下是功能差异（显高、遮肚、防走光）。这两层才是选品的颗粒度。 */

/* 尺码 / 孕产是人群维度，比款式硬：写了「大码」就不该按牛仔款算 */
const SIZE_DIM_RE = /大码|加大|加肥|胖|plus.?size|孕妇|孕期|maternity/i;

function subRows(ctx) {
  const prof = (ctx.__auto && ctx.__auto.profile) || null;
  const table = (prof && prof.id && SUBS[prof.id]) || null;
  if (!table || table.length < 2) return null;   /* null → 调用方退回品类形态矩阵 */
  const fx = MK_FX[ctx.market] == null ? 1 : MK_FX[ctx.market];
  const p0 = num(ctx.price, 0);
  const name = String(ctx.product || '');

  let idx = table.findIndex(r => r[1] && r[1].test(name));
  if (SIZE_DIM_RE.test(name)) {
    const j = table.findIndex(r => SIZE_DIM_RE.test(r[0]) && r[1] && r[1].test(name));
    if (j > -1) idx = j;
  }
  const autoPick = idx < 0;
  if (autoPick) idx = 0;   /* 没写款式 → 按表内第一行（该类目的基础款）处理，并明说 */

  const rows = table.map((r, i) => {
    const lo = Math.round(r[3] * fx), hi = Math.round(r[4] * fx);
    const mid = (lo + hi) / 2;
    const isCur = i === idx;
    /* 用「细分价位中位 vs 本品价」的价差分级，而不是「本品价落在区间里」——
       区间本来就宽，逐点判断会让七八个细分全都「重叠」，等于没判。 */
    const d = p0 > 0 ? Math.abs(mid - p0) / p0 : 1;
    let rel = '高处一档 · 不同批人', tone = 'blue';
    if (isCur) { rel = '本品'; tone = 'good'; }
    /* 没写款式时这是「暂按这款算」，不能标成本品，否则用户以为系统认得他的货 */

    else if (p0 && d <= 0.10) { rel = '价格重叠 · 抢位'; tone = 'bad'; }
    else if (p0 && d <= 0.25) { rel = mid > p0 ? '略高 · 同批人比价' : '略低 · 同批人比价'; tone = 'mid'; }
    else if (p0 && mid < p0) { rel = '低价款 · 抢预算'; tone = 'blue'; }
    return { zh: r[0], form: r[2], lo, hi, mid, aud: r[5], kw: r[6], rel, tone, isCur, d };
  });
  return { rows, cur: rows[idx], autoPick, n: rows.length, prof };
}

function funcRows(ctx) {
  const prof = (ctx.__auto && ctx.__auto.profile) || null;
  const id = prof && prof.id;
  const list = (id && FUNCS[id]) || FUNCS_CAT[(ctx.category || '').trim()] || [];
  return list.map(r => ({ f: r[0], who: r[1], kw: r[2], gap: r[3], act: r[4] }));
}

function subSection(ctx) {
  const S = subRows(ctx);
  if (!S) return '';
  const { rows, cur, autoPick } = S;
  const sym = mkOf(ctx.market).sym;
  const cat = (ctx.category || '').trim();
  const formName = String((S.prof && S.prof.zh) || '').split(/\s*\/\s*/)[0] || '本品';
  const others = ALL_PROFILES.filter(p => p.cat === cat && p.id !== (S.prof && S.prof.id));
  const overlap = rows.filter(r => r.rel.indexOf('价格重叠') > -1);
  const fs = funcRows(ctx);

  const head = autoPick
    ? `形态细分：${esc(formName)}这一类收录了 ${S.n} 种款，本品名<b>只到形态这一级</b>，先按主流款「${esc(cur.zh)}」算`
    : `形态细分：${esc(formName)}这一类有 ${S.n} 种款，本品落在「${esc(cur.zh)}」`;

  return `
    <h3>${head}</h3>
    <p class="plead">搜同一个词时，这 ${S.n} 种款会挤在<b>同一页结果里互相抢点击</b>——它们才是你的直接对手。
      ${others.length ? `同品类里的其它形态（${esc(others.slice(0, 3).map(p => String(p.zh).split(/\s*\/\s*/)[0]).join('、'))}等 ${others.length} 个）不做这批搜索词，不在这里展开。` : ''}
      款式差的是<b>结构和价位</b>，不是名字。</p>
    <div class="ptable">
      <table>
        <thead><tr><th>细分款</th><th>结构 / 做法差异</th><th class="c">主流价位</th><th>核心人群</th><th>核心搜索词</th><th class="c">与本品关系</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr${r.isCur ? ' class="trcur"' : ''}>
            <td><b>${esc(r.zh)}</b>${r.isCur ? `<i class="tg tg-good">${autoPick ? '暂按此款' : '本品'}</i>` : ''}</td>
            <td class="sub2">${esc(r.form)}</td>
            <td class="c nw">${sym}${r.lo}–${sym}${r.hi}</td>
            <td class="sub2">${esc(r.aud)}</td>
            <td class="sub2">${esc(r.kw)}</td>
            <td class="c"><i class="tg tg-${r.tone}">${esc(r.rel)}</i></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="pnote">${autoPick
      ? `只写「${esc(formName)}」等于还没选战场：搜索词 <b>${esc(cur.kw)}</b> 的主体就是${esc(cur.zh)}，所以先按它算。你要卖的是别的款，在产品名里补一个款式词（「工装」「阔腿」「大码」都行），整张表会重排。`
      : `${esc(cur.zh)}的主流价位是 ${sym}${cur.lo}–${sym}${cur.hi}，同价位还有 ${overlap.length} 个细分款在抢同一批人——它们才是主图要打的对手，其余只是「换个款式买」。`}</p>

    ${fs.length ? `
    <h3>功能细分：同一条${esc(formName)}，卖的是 ${fs.length} 种不同的「为什么买」</h3>
    <p class="plead">款式决定你和谁抢，<b>功能决定你在详情页第一屏说什么</b>。同一件货，主打「显高」和主打「遮肚」是两个人群、两组搜索词、两套图。</p>
    <div class="ptable">
      <table>
        <thead><tr><th>功能主张</th><th>谁在买</th><th>买家会搜</th><th>现有货的短板</th><th class="c">可下手的地方</th></tr></thead>
        <tbody>
          ${fs.map(f => `<tr>
            <td><b>${esc(f.f)}</b></td>
            <td class="sub2">${esc(f.who)}</td>
            <td class="sub2">${esc(f.kw)}</td>
            <td class="sub2">${esc(f.gap)}</td>
            <td class="sub2">${esc(f.act)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="pnote">功能轴是从该类目的<b>差评共性 + 搜索词结构</b>推出来的，不是拍脑袋：每一条都能在竞品详情页找到「没写」的证据。
      抓完真实竞品后，把「现有货的短板」换成真实差评原句，这张表就能直接当详情页大纲用。
      先挑 <b>1–2 条</b>打，全打等于没打——首屏只放得下一个主张。</p>` : ''}`;
}

/* 同品类下的形态由知识库带出：中文形态名 + 使用方式 + 价位 + 人群 + 核心词 */
function formRows(ctx) {
  /* 品类没定就没有「同形态」可言，不要拿厨房小家电的形态去凑 */
  const cat = (ctx.category || '').trim();
  if (!cat) return [];
  const prof = (ctx.__auto && ctx.__auto.profile) || null;
  const curId = (prof && prof.id) || inferCat(ctx.product || '').hit || '';
  const fx = MK_FX[ctx.market] == null ? 1 : MK_FX[ctx.market];
  const p0 = num(ctx.price, 0);
  const pool = ALL_PROFILES.filter(p => p.cat === cat);
  if (!pool.length) return [];

  return pool.map(p => {
    const lo = Math.round(p.band[0] * fx), hi = Math.round(p.band[1] * fx);
    const isCur = p.id === curId;
    let rel = '同形态不同款', tone = 'blue';
    if (isCur) { rel = '本品'; tone = 'good'; }
    else if (p0 >= lo && p0 <= hi) { rel = '价格重叠 · 抢位'; tone = 'bad'; }
    else if (lo > p0 && p0 > 0) { rel = '向上替代'; tone = 'mid'; }
    else if (p0 > 0) { rel = '向下替代'; tone = 'mid'; }
    return {
      zh: p.zh || p.en, form: p.form || '—', lo, hi,
      aud: String(p.aud).split(/[;；]/)[0].replace(/；$/, ''),
      en: p.en, rel, tone, isCur
    };
  });
}

function formMapSection(ctx) {
  const rows = formRows(ctx);
  if (rows.length < 2) return '';
  const sym = mkOf(ctx.market).sym;
  const cur = rows.find(r => r.isCur);
  const cat = (ctx.category || '').trim();

  return `
    <h3>先归类：${esc(cat)}里有 ${rows.length} 种形态</h3>
    <p class="plead">同一个小类目下，「形态」比「品类」更能决定竞争：用法不同＝搜索词不同＝对手不同。先把货归到格子里，再看格子里的对手。</p>
    <div class="ptable">
      <table>
        <thead><tr><th>形态</th><th>怎么用（结构）</th><th class="c">主流价位</th><th>核心人群</th><th>核心搜索词</th><th class="c">与本品关系</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr${r.isCur ? ' class="trcur"' : ''}>
            <td><b>${esc(r.zh)}</b>${r.isCur ? '<i class="tg tg-good">本品</i>' : ''}</td>
            <td class="sub2">${esc(r.form)}</td>
            <td class="c nw">${sym}${r.lo}–${sym}${r.hi}</td>
            <td class="sub2">${esc(r.aud)}</td>
            <td class="sub2">${esc(r.en)}</td>
            <td class="c"><i class="tg tg-${r.tone}">${esc(r.rel)}</i></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <p class="pnote">${cur
      ? `本品落在一「<b>${esc(cur.zh)}</b>」（${sym}${cur.lo}–${sym}${cur.hi}），价格重叠的形态有 ${rows.filter(r => r.rel.indexOf('价格重叠') > -1).length} 个——它们才是真对手，其它形态只是「替代品」。`
      : `还没识别出本品形态，按价位判断：与本品价格重叠的那几行，就是首屏上真正抢你点击的对手。`} 
      归类只做三件事：搜索意图（买家搜什么词）、功能用途（解决什么动作）、目标人群（谁在用）。三者都不同，就是两个类目；只差一个，就是同一战场里的两个位置。</p>`;
}

/* ---------- ② 头部评价体量分层 ---------- */
function structStats(list) {
  const rs = list.map(p => p[4]).sort((a, b) => b - a);
  const tot = rs.reduce((a, b) => a + b, 0) || 1;
  const t = (lo, hi) => {
    const arr = rs.filter(r => r >= lo && (hi == null || r < hi));
    return { n: arr.length, share: arr.reduce((a, b) => a + b, 0) / tot };
  };
  return {
    top: t(20000), mid: t(5000, 20000), low: t(0, 5000),
    top3: rs.slice(0, 3).reduce((a, b) => a + b, 0) / tot,
    max: rs[0], min: rs[rs.length - 1]
  };
}

function structBlock(list, st) {
  const ss = structStats(list);
  const thin = ss.low.n >= 2;
  return `
      <div class="cstat cstat-4">
        <div><b>${ss.top.n}</b><span>评价 &gt; 2 万（重壁垒）</span></div>
        <div><b>${ss.mid.n}</b><span>5 千–2 万（可追平）</span></div>
        <div><b>${ss.low.n}</b><span>&lt; 5 千（新品位）</span></div>
        <div><b>${Math.round(ss.max / Math.max(1, ss.min))}×</b><span>头尾评价差</span></div>
      </div>
      <p class="gcell-f">评价存量分层看的是「壁垒厚度」：${ss.low.n >= 2
      ? `样本里有 ${ss.low.n} 款低于 5 千条，说明这个类目<b>还能让新品挤进首屏</b>，不必等三年。`
      : ss.low.n === 1
        ? `样本里只有 1 款低于 5 千条，首屏几乎全被评价量锁死，新品只能靠<b>站外流量或差异化词</b>绕开正面比价。`
        : `样本里没有低于 5 千条的款，首屏已被评价量锁死，新品只能靠<b>站外流量或差异化词</b>绕开正面比价。`}</p>`;
}

/* ---------- ③ 需求成色 ---------- */
function demandTone(cat) {
  const c = catOf(cat);
  const s = c.season || '', ret = c.ret || 8;
  let k = '季节驱动', why = `销量集中在 ${s}，淡季要靠新品与套装续命`;
  if (/全年/.test(s)) { k = '刚需'; why = '全年可卖、没有明显淡季，需求不靠节日推动'; }
  else if (/Q4/.test(s) && /Q[123]/.test(s)) { k = '双峰'; why = `${s}，两次高峰之间要靠内容维持排名`; }
  else if (/Q4/.test(s)) { k = '礼赠驱动'; why = '销量压在 Q4，1–3 月会掉一半以上，现金流要提前排'; }
  if (ret >= 12) why += `；退货率约 ${ret}%，实际毛利要再打折`;
  return { k, why, ret };
}

/* ---------- ④ 风险闸门 ---------- */
const RISK = {
  '厨房小家电': { cert: 'FDA 食品接触 + FCC + UL/ETL 电气安全', c: 2, p: 2, i: 1, spec: '必须 110V/60Hz 美规插头；带锂电池另需 UN38.3 + MSDS' },
  '宠物用品': { cert: '无强制认证，但需无毒材料声明与 CPSIA 兜底', c: 1, p: 3, i: 2, spec: '刷头 / 滚轮 / 卡扣结构专利密集，先查外观专利再开模' },
  '家居收纳': { cert: '无强制认证；接触食品才需 FDA', c: 0, p: 1, i: 1, spec: '结构一眼能抄，壁垒在模具精度与套装组合，不在外形' },
  '3C 数码': { cert: 'FCC + UL/ETL + UN38.3；无线充需 Qi / MFi', c: 2, p: 2, i: 2, spec: 'MagSafe、MFi 是商标与授权双门槛，标题里出现即违规' },
  '美妆个护': { cert: 'FDA 化妆品注册 / OTC 需 NDC；成分按 INCI 标注', c: 3, p: 1, i: 1, spec: '「治疗 / 修复 / 祛斑 / 消炎」等功效词会触发 FDA 警告信' },
  '户外运动': { cert: 'CPSC 一般安全；儿童款需 CPC', c: 1, p: 2, i: 1, spec: '承重类必须第三方实测；帐篷阻燃需 CPAI-84' },
  '母婴用品': { cert: 'CPC + ASTM F963 + CPSIA 铅镉测试', c: 3, p: 2, i: 2, spec: '入口与贴身件没有第三方报告＝上架即下架，别省这笔钱' },
  '服饰配饰': { cert: 'CPSIA + 加州 Prop 65（化学物质）', c: 1, p: 1, i: 2, spec: '图案 / 印花 / 角色形象是最高频下架原因，原创或授权二选一' },
  '家居清洁': { cert: '无强制；宣称杀菌消毒需 EPA 注册', c: 2, p: 1, i: 1, spec: '「杀菌 / 消毒 / 除菌 99.9%」一旦写进文案就落入农药类监管' },
  '灯具照明': { cert: 'FCC + UL/ETL；含电池需 UN38.3', c: 2, p: 2, i: 1, spec: 'LED 驱动与插头无认证会卡清关，别用「通用适配器」凑' },
  '汽车用品': { cert: '无强制；电子件需 FCC', c: 1, p: 2, i: 1, spec: '不得宣称「不影响安全气囊」，涉及安全件的责任无法兜底' },
  '玩具益智': { cert: 'CPC + ASTM F963 + CPSIA；3 岁以下禁小零件', c: 3, p: 2, i: 2, spec: '卡通形象无授权即侵权，比质量问题的封店概率更高' },
  '办公文具': { cert: '无强制；儿童文具需 CPSIA', c: 0, p: 1, i: 1, spec: '门槛低＝对手多，靠设计套装与内容而非专利' },
  '园艺工具': { cert: '无强制；电动工具需 FCC / UL', c: 1, p: 1, i: 1, spec: '刃口与承重需实拍说明，避免「割伤」类投诉' },
  '家用电器': { cert: 'FCC + UL/ETL；水箱类需 FDA 食品接触或 NSF', c: 3, p: 2, i: 1, spec: '插头必须美规 110V；带压缩机的另需 EPA 制冷剂备案' },
  '厨房用具': { cert: '食品接触材料需 FDA 21 CFR；不粘涂层需 PFOA-free 声明', c: 2, p: 2, i: 2, spec: '刀类在部分州/平台属限制品，刀刃长度与包装警示要写清；「抗菌 / 医用级」不能随便标' },
  '健康护理': { cert: 'FCC（带电）；宣称缓解疼痛可能触发 FDA 器械或 FTC 功效监管', c: 2, p: 2, i: 2, spec: '别写「治疗 / 治愈 / 医疗级」；护具类若声称矫正需 510(k)，只讲支撑与体感' },
  '（未填品类）': { cert: '按具体品类逐项确认，不要默认「不用认证」', c: 1, p: 1, i: 1, spec: '先填品类，否则风险只能给区间，不能给结论' }
};

/* 医疗 / 功效红线：命中即视为强监管 */
const MED_RE = /(矫正|护具|治疗|康复|医|止痛|消炎|杀菌|消毒|助眠|血压|血糖|按摩|功效|疗程)/;

function riskGates(ctx) {
  const cat = (ctx.category || '').trim();
  const r = RISK[cat] || RISK['（未填品类）'];
  const ret = catOf(cat).ret || 8;
  const med = MED_RE.test(String(ctx.product || '') + ' ' + String(ctx.points || ''));
  const lv = n => n >= 3 ? 'bad' : n >= 2 ? 'mid' : 'good';

  const gates = [
    {
      k: '认证准入', t: lv(med ? 3 : r.c),
      v: med ? '强监管' : r.c >= 3 ? '门槛高' : r.c >= 2 ? '需认证' : '门槛低',
      why: med ? '产品名/卖点里出现矫正、治疗、杀菌这类词，会被按医疗器械或功效产品监管' : r.cert,
      act: med ? '先删掉所有疗效表述，只讲结构与体感；再确认是否需 510(k) 或 OTC 备案' : '把认证清单发给工厂要证书编号与检测报告，缺一项就不上架'
    },
    {
      k: '专利 / 结构', t: lv(r.p),
      v: r.p >= 3 ? '密集' : r.p >= 2 ? '中等' : '稀疏',
      why: r.p >= 2 ? '这个类目的结构专利与外观专利重叠度高，开模前必须检索' : '结构简单，撞专利的概率低，但仍需查一次外观',
      act: r.p >= 2 ? '用 Google Patents 按结构特征检索 3 个关键词，再让工厂出「规避设计」版本' : '记录自家结构与竞品的差异点，作为被投诉时的证据'
    },
    {
      k: '侵权 / 品牌', t: lv(r.i),
      v: r.i >= 3 ? '高危' : r.i >= 2 ? '注意' : '低',
      why: r.i >= 3 ? '图案、形象、商标词是这个类目最常见的下架原因' : '侵权主要来自图片与文案，控制好素材来源即可',
      act: r.i >= 2 ? '不碰角色形象与品牌词；主图全部自拍，文案不用「兼容 XX」以外的商标' : '素材自制或购买商用授权，保留授权凭证'
    },
    {
      k: '退货 / 质量', t: ret >= 15 ? 'bad' : ret >= 10 ? 'mid' : 'good',
      v: `约 ${ret}%`,
      why: ret >= 15 ? '退货率最高的类目之一：尺码与预期落差会吃掉全部毛利' : ret >= 10 ? '退货会吃掉 1/10 的营收，必须把预期管理写进详情页' : '退货可控，重点在首次使用的体验',
      act: ret >= 15 ? '先做尺码表与真人试穿图；把「不合身可退」写进详情页，降低纠纷率' : '主图标注真实尺寸/克重，参数表逐项对应实物'
    }
  ];
  const rank = t => t === 'bad' ? 0 : t === 'mid' ? 1 : 2;
  const worst = gates.slice().sort((a, b) => rank(a.t) - rank(b.t))[0];
  const badN = gates.filter(g => g.t === 'bad').length;
  /* 「四个中等」不该比「一个红灯」还惨：bad 扣得多，mid 只扣一点 */
  const score = clamp(10 - badN * 3.4 - gates.filter(g => g.t === 'mid').length * 0.9, 1, 10);
  return { gates, score: Math.round(score * 10) / 10, badN, worst, med, spec: r.spec };
}

function riskSection(ctx, n) {
  const R = riskGates(ctx);
  return `
    <h3>风险闸门：这四关过不了，后面的钱都别投</h3>
    <p class="plead">合规与专利是「一票否决」，不是评分项——被下架一次，前面的排名与评论全部清零。</p>
    <div class="gates">
      ${R.gates.map(g => `
      <div class="gate gt-${g.t}">
        <div class="gate-h"><b>${esc(g.k)}</b><i>${esc(g.v)}</i></div>
        <p class="gate-w">${esc(g.why)}</p>
        <p class="gate-a"><em>怎么过</em>${esc(g.act)}</p>
      </div>`).join('')}
    </div>
    ${R.spec ? `<p class="gate-spec"><b>类目特有红线</b>${esc(R.spec)}</p>` : ''}
    <p class="pnote">${R.med
      ? `<b>红线：</b>本品涉及医疗 / 功效表述，先确认是否落入 FDA 器械或 OTC 监管，再谈卖点——这一条不解决，其它分析都作废。`
      : `四关里最该先动的是「${esc(R.worst.k)}」（${esc(R.worst.v)}）。合规成本是可以算进定价的，专利与侵权成本不能。`}</p>`;
}

/* ---------- ⑤ 四关放行 ---------- */
function selGates(ctx, list, st, sc) {
  const price = num(ctx.price, 0) || st.med;
  const em = (ctx.__vals && ctx.__vals.emotion) || {};
  /* 与「选品三问」用同一套成本口径（默认 42 元货值 + 9 元头程），两章的数字才对得上 */
  const costY = num(em.cost, 42), frY = num(em.freight, 9);
  const rate = num(em.rate, 7.1) || 7.1;
  const costUsd = (costY + frY) / rate;
  const pf = pfOf(ctx.platform);
  const fee = price * pf.fee / 100;
  const ful = FUL[ctx.platform] !== undefined ? FUL[ctx.platform] : 4.2;
  const gp = price - costUsd - fee - ful;
  const gm = price > 0 ? gp / price : 0;
  const beRoas = gp > 0 ? price / gp : 0;

  const dq = demandTone(ctx.category);
  const R = riskGates(ctx);

  const demand = clamp((sc.demand * .7) + (dq.k === '刚需' ? 3 : dq.k === '双峰' ? 2.4 : 1.6), 1, 10);
  const profit = gm >= .45 ? 10 : gm >= .38 ? 8 : gm >= .30 ? 6 : gm >= .22 ? 4 : 2;

  const parts = [
    { k: '需求真实', v: Math.round(demand * 10) / 10, veto: true, tone: demand >= 7 ? 'good' : demand >= 5 ? 'mid' : 'bad', why: `${dq.k} · ${dq.why}`, note: dq.k },
    { k: '竞争可插', v: sc.comp, veto: false, tone: sc.comp >= 7 ? 'good' : sc.comp >= 5 ? 'mid' : 'bad', why: `第一名占 ${pct(st.top1Share)} 的评论存量，首屏位基本被锁`, note: sc.comp >= 7 ? '有空位' : sc.comp >= 5 ? '要绕' : '锁死' },
    { k: '利润够撑', v: profit, veto: true, tone: profit >= 8 ? 'good' : profit >= 6 ? 'mid' : 'bad', why: `按 ${symOf(ctx)}${Math.round(price)} 算，毛利 ${pct(gm)}，保本 ROAS ${beRoas ? beRoas.toFixed(2) : '—'}`, note: pct(gm) },
    { k: '风险可解', v: Math.round(R.score), veto: true, tone: R.score >= 7 ? 'good' : R.score >= 5 ? 'mid' : 'bad', why: R.badN ? `${R.badN} 项红灯（${R.worst.k}）` : '四道闸都是「需要注意」，单关能过但叠加起来成本高', note: R.badN ? '有红线' : '叠加偏高' }
  ];
  const weakest = parts.slice().sort((a, b) => a.v - b.v)[0];
  return { parts, weakest, gm, beRoas, price, demand: dq, risk: R };
}

const symOf = ctx => mkOf(ctx.market).sym;

function gateBarHtml(G) {
  return `<div class="gbar">
    ${G.parts.map(p => `<div class="gbar-i gb-${p.tone}">
      <div class="gbar-t"><b>${esc(p.k)}</b><em>${p.v}</em></div>
      <span>${esc(p.why)}</span>
    </div>`).join('')}
  </div>`;
}

</script>
<script>
/* =========================================================
   supply.js — 供需账
   ---------------------------------------------------------
   月搜索量 ÷ 在售卖家数 = 每个卖家能分到的自然流量

   ≥ 1.0   基础曝光不错，进得去
   0.8–1.0 可进，但要有差异化（用户方法的优先线）
   0.3–0.8 偏挤，得靠长尾词和广告
   < 0.3   红海，自然流量分不到，很难出单

   分子来自关键词月搜索量，分母取亚马逊搜索结果总数
   （比逐款数链接更准，因为它就是这一批词下的全部在售）。
   两个数都能被真实值替换：分母联网即真值，分子填一次就行。
   ========================================================= */

/* 类目核心词的月搜索量基准（次/月）—— 这是估算，不是抓来的。
   换真值的方法写在表格下面：卖家精灵 / Helium10 的「月搜索量」抄一个进来。 */
const CAT_VOL = {
  '厨房小家电': [22000, 85000],
  '家用电器': [18000, 70000],
  '3C 数码': [35000, 140000],
  '服饰配饰': [30000, 120000],
  '美妆个护': [28000, 110000],
  '宠物用品': [14000, 58000],
  '母婴用品': [16000, 62000],
  '家居收纳': [15000, 52000],
  '家居清洁': [12000, 46000],
  '户外运动': [16000, 65000],
  '汽车用品': [13000, 50000],
  '玩具益智': [17000, 68000],
  '办公文具': [8000, 32000],
  '灯具照明': [9000, 38000],
  '园艺工具': [7000, 28000]
};

/* 亚马逊搜索结果总数基准（≈ 在售链接数）。
   实测校准：womens overalls 返回「over 50,000 results」，所以量级是万级不是千级 ——
   早先按几千条给基准，估出来的比值会普遍虚高两三倍。 */
const CAT_SELLERS = {
  '3C 数码': [12000, 90000], '服饰配饰': [20000, 150000], '美妆个护': [15000, 80000],
  '厨房小家电': [8000, 45000], '家用电器': [9000, 55000], '宠物用品': [6000, 30000],
  '母婴用品': [7000, 40000], '家居收纳': [6000, 35000], '家居清洁': [5000, 28000],
  '户外运动': [8000, 45000], '汽车用品': [6000, 32000], '玩具益智': [8000, 50000],
  '办公文具': [4000, 20000], '灯具照明': [5000, 25000], '园艺工具': [3000, 18000]
};

/* 细分款在形态内部的相对搜索权重：第一行是主流款，往后是长尾。
   只用于「没联网也没填数」时的兜底估算，联网后整列换成真值。 */
const SUB_W = [1, 0.58, 0.46, 0.36, 0.29, 0.23, 0.18, 0.14];

const bandOf = r =>
  r >= 1.0 ? { k: 'good', t: '供不应求', s: '基础曝光不错，进去就有自然流量' } :
  r >= 0.8 ? { k: 'good', t: '可进', s: '过了优先线，但要有一个明确差异点' } :
  r >= 0.3 ? { k: 'mid', t: '偏挤', s: '自然流量薄，得靠长尾词和广告撑' } :
             { k: 'bad', t: '红海', s: '每个卖家分不到几分流量，很难出单' };

/* 分子是估的时候，比值只能用来排序 —— 不能套绝对阈值。
   否则一个 3 倍误差的估算会告诉你「这个类目供不应求」，那是害人。 */
const relBand = (r, all) => {
  const s = all.slice().sort((a, b) => b.r - a.r);
  const i = s.findIndex(x => x.r === r);
  const q = s.length ? i / s.length : 0;
  if (q < 0.3) return { k: 'good', t: '相对松', s: '同组里最松的一档，先看这几款' };
  if (q < 0.7) return { k: 'mid', t: '居中', s: '组内居中，要靠差异点才进得去' };
  return { k: 'bad', t: '相对紧', s: '同组里最挤的一档，别当主攻' };
};

const numFmt = n => (n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '万' : String(n));

function catRange(tbl, cat, dflt) {
  const k = String(cat || '').trim();
  return tbl[k] || dflt;
}

/* 一行：搜索量 S / 卖家数 N / 比值 r / 数据来源 */
function supplyRows(ctx) {
  const S = subRows(ctx);
  if (!S) return null;
  const A = ctx.__auto || {};
  const live = A.live || {};
  const resMap = live.results || {};        /* { 英文词: 搜索结果数 } */
  const volMap = live.vol || {};            /* { 英文词: 月搜索量 } */
  const [vLo, vHi] = catRange(CAT_VOL, ctx.category, [12000, 45000]);
  const [sLo, sHi] = catRange(CAT_SELLERS, ctx.category, [1800, 9000]);
  const userVol = num(ctx.volume, 0);       /* 侧栏手填的月搜索量，优先于一切估算 */

  const rows = S.rows.map((r, i) => {
    const w = SUB_W[i] || 0.14;
    const kw = r.kw || '';

    /* 分子：手填 > 抓到的实时词量 > 类目基准 × 细分权重 */
    let v = 0, vsrc = 'est', vlo = Math.round(vLo * w), vhi = Math.round(vHi * w);
    if (i === 0 && userVol > 0) { v = userVol; vsrc = 'user'; vlo = vhi = v; }
    else if (volMap[kw] > 0) { v = volMap[kw]; vsrc = 'net'; vlo = vhi = v; }
    else { v = Math.round(((vlo + vhi) / 2)); }

    /* 分母：抓到的真实结果数 > 类目基准 × 细分修正（长尾款卖家少） */
    let n = 0, nsrc = 'est';
    if (resMap[kw] > 0) { n = resMap[kw]; nsrc = 'net'; }
    else { n = Math.round(((sLo + sHi) / 2) * (0.62 + i * 0.07)); }

    const rr = n > 0 ? v / n : 0;
    return {
      zh: r.zh, kw, isCur: r.isCur, v, n, r: rr,
      vsrc, nsrc, w, lo: vlo, hi: vhi,
      real: vsrc !== 'est'          /* 分子真实，比值才能套绝对阈值 */
    };
  });

  /* 分档：分子实测/手填 → 套绝对阈值；分子是估的 → 只做同组内相对排序 */
  const pool = rows.map(x => ({ r: x.r }));
  rows.forEach(x => { x.band = x.real ? bandOf(x.r) : relBand(x.r, pool); });

  return {
    rows, cur: rows.find(x => x.isCur) || rows[0], n: rows.length,
    anyNet: rows.some(x => x.nsrc === 'net'),
    anyReal: rows.some(x => x.real)
  };
}

/* 趋势：只看「同一个月在不同日期记的同一组数」没意义，
   所以按月份归并，取最近三个月比较。不足三个月就老实说不够。 */
function trendOf(ctx, kw) {
  const h = (ctx.__auto && ctx.__auto.hist) || [];
  const mine = h.filter(x => x && x.kw === kw);
  const byMon = {};
  mine.forEach(x => { const m = String(x.d || '').slice(0, 7); if (m) byMon[m] = x; });
  const ms = Object.keys(byMon).sort();
  if (ms.length < 2) {
    return { ok: false, need: 2 - ms.length, mon: ms.length, pts: ms.map(m => byMon[m].v) };
  }
  const last = ms.slice(-3);
  const pts = last.map(m => byMon[m].v);
  const chg = [];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i - 1] > 0) chg.push((pts[i] - pts[i - 1]) / pts[i - 1]);
  }
  const up = chg.length && chg.every(c => c > 0);
  const flat = chg.length && chg.every(c => Math.abs(c) < 0.05);
  const avg = chg.length ? chg.reduce((a, b) => a + b, 0) / chg.length : 0;
  return {
    ok: true, mon: ms.length, pts, chg, avg, last,
    state: up ? 'up' : (flat ? 'flat' : (avg < 0 ? 'down' : 'mix'))
  };
}

function supplySection(ctx, n) {
  const A = ctx.__auto || {};
  const D = supplyRows(ctx);
  if (!D) {
    return `<h3>供需账：这个细分挤不挤</h3>
      <p class="plead">算这张账要两个数：<b>月搜索量</b>和<b>在售卖家数</b>。目前产品名只到形态一级、还没落到具体款式，
        账就无从算起 —— 在产品名里补一个款式词（「工装」「阔腿」「大码」），这一节会自动出现。</p>`;
  }

  const cur = D.cur;
  /* 每行的档位在 supplyRows 里已经按各自的数据源判过：
     分子真实的套绝对阈值，分子是估的只给组内相对位。这里只汇总，不重判。 */
  const curReal = !!(cur && cur.real);
  const realMode = curReal;
  const estRows = D.rows.filter(x => !x.real).length;
  /* 过线/红线只认真实的行：拿估值去凑「有 3 款过 0.8」是骗人的 */
  const pass = realMode
    ? D.rows.filter(x => x.real && x.r >= 0.8).sort((a, b) => b.r - a.r)
    : D.rows.filter(x => x.band.k === 'good');
  const dead = realMode
    ? D.rows.filter(x => x.real && x.r < 0.3)
    : D.rows.filter(x => x.band.k === 'bad');
  const tr = cur ? trendOf(ctx, cur.kw) : { ok: false, need: 2, mon: 0 };
  const live = A.live || {};
  const hasNet = D.anyNet;
  const srcTag = x => x === 'net' ? '<i class="sg sg-net">实测</i>'
    : (x === 'user' ? '<i class="sg sg-user">手填</i>' : '<i class="sg sg-est">估</i>');

  const trCell = () => {
    if (!tr.ok) {
      return `<span class="tr-need">需 ${tr.need} 次月度记录</span>`;
    }
    const arrow = tr.state === 'up' ? '↑' : (tr.state === 'down' ? '↓' : '→');
    const tone = tr.state === 'up' ? 'good' : (tr.state === 'down' ? 'bad' : 'mid');
    const pct = (tr.avg * 100).toFixed(1).replace('-', '');
    return `<i class="tg tg-${tone}">${arrow} ${tr.state === 'up' ? '+ ' : (tr.state === 'down' ? '- ' : '± ')}${pct}%/月</i>`;
  };

  return `
    <h3>供需账：先算每个卖家能分到多少流量</h3>
    <p class="plead">选品不是「这个类目大不大」，是<b>这块饼分给多少人</b>。用<b>月搜索量 ÷ 在售卖家数</b>，
      得到的是每个卖家能分到的自然流量份额。这一步做完，才知道后面四关值不值得过。</p>

    <div class="sflow">
      <div class="sf">
        <em>① 定范围</em>
        <b>锁到细分款，不是大类</b>
        <span>「${esc(String((ctx.category || '品类')).split(' › ')[0])}」里的不同款式不做同一批词，混在一起算等于没算。这一节锁在<b>${esc(cur ? cur.zh : '本品细分')}</b>这一类 ${D.n} 款上。</span>
      </div>
      <div class="sf">
        <em>② 算比值</em>
        <b>月搜索量 ÷ 卖家数</b>
        <span>分母取亚马逊搜索结果总数（这一批词下的全部在售），比逐款数链接更准。优先挑 <b>≥ 0.8</b> 的款，<b>&lt; 0.3</b> 直接放弃。</span>
      </div>
      <div class="sf">
        <em>③ 看趋势</em>
        <b>连续三个月往上就够</b>
        <span>哪怕每月只涨 5%，说明需求在长；连续跌的款，比值再高也是接盘。趋势靠本页按月累计，第一次打开时为基准月。</span>
      </div>
    </div>

    <div class="ptable stab">
      <table>
        <thead><tr>
          <th>细分款</th>
          <th class="c">月搜索量</th>
          <th class="c">在售卖家</th>
          <th class="c">供需比</th>
          <th class="c">档位</th>          <th>怎么读</th>
          <th class="c">近三月趋势</th>
        </tr></thead>
        <tbody>
          ${D.rows.map((x, i) => `<tr${x.isCur ? ' class="trcur"' : ''}>
            <td><b>${esc(x.zh)}</b>${x.isCur ? '<i class="tg tg-good">本品</i>' : ''}
              ${x.kw ? `<div class="sub2 kwx">${esc(x.kw)}</div>` : ''}</td>
            <td class="c nw">${numFmt(x.v)} ${srcTag(x.vsrc)}</td>
            <td class="c nw">${numFmt(x.n)} ${srcTag(x.nsrc)}</td>
            <td class="c"><b class="sr ${x.real ? 'sr-' + x.band.k : 'sr-est'}">${x.real ? '' : '≈'}${x.r.toFixed(2)}</b></td>
            <td class="c"><i class="tg tg-${x.band.k}">${x.band.t}</i></td>
            <td class="sub2">${esc(x.band.s)}</td>
            <td class="c">${i === (D.rows.findIndex(y => y.isCur)) ? trCell() : '<span class="tr-need">—</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="stopbox ${realMode ? (cur && cur.band.k === 'bad' ? 'warn' : 'ok') : ''}">
      <b>${!realMode
        ? `先排序，别急着定生死：最松的是 ${esc(pass[0] ? pass[0].zh : (D.rows[0] || {}).zh || '—')}（比值 ${(pass[0] || D.rows[0] || {}).r ? (pass[0] || D.rows[0]).r.toFixed(2) : '—'}）`
        : (cur ? (cur.band.k === 'good' ? `这个细分能进：供需比 ${cur.r.toFixed(2)}` : cur.band.k === 'mid' ? `偏挤但能做：供需比 ${cur.r.toFixed(2)}` : `不建议硬进：供需比 ${cur.r.toFixed(2)}，低于 0.3 的红线`) : '数据不足')}</b>
      <span>${!realMode
        ? `分子（月搜索量）是估算的，误差可能有几倍，所以这一档只做<b>同组横向排序</b>，不套绝对阈值——估值算出来的「供不应求」不作数。
           把真实的月搜索量填进侧栏「手动修改 › 月搜索量」，或联网补上卖家数，这张表立刻改成按 <b>≥1.0 / 0.8 / 0.3</b> 判档。`
        : (pass.length
          ? `这 ${D.n} 款里比值 ≥ 0.8 的有 <b>${pass.length}</b> 款（${pass.slice(0, 3).map(x => esc(x.zh)).join('、')}${pass.length > 3 ? ' 等' : ''}），优先从这里面挑。`
          : `这 ${D.n} 款里<b>没有一款过 0.8</b> —— 要么换形态，要么换类目，在这个细分里拼价格没有出路。`)
          + (estRows ? ` 其余 ${estRows} 款的数据还没换成真值，不能用这条线判，只做组内排序。` : '')
          + (dead.length ? ` 另有 <b>${dead.length}</b> 款已跌破 0.3（${dead.slice(0, 2).map(x => esc(x.zh)).join('、')}${dead.length > 2 ? ' 等' : ''}），别碰。` : '')}</span>
    </div>

    <p class="pnote">${hasNet
      ? `卖家数那一列标「实测」的，是<b>刚从亚马逊搜索页抓到的原值</b>；标「估」的是类目基准推算。`
      : `这张表的两个数<b>目前都是估算</b>：卖家数按类目基准推、搜索量按核心词基准 × 细分权重推。量级和相对高低可以参考，<b>绝对值不要当真</b>。`}
      ${!realMode ? '<b>所以这一档只排序、不判档</b>：真正的「供不应求 / 红海」必须分子分母都真才成立，估值套阈值只会给出过度乐观的结论。'
        : (estRows ? `本品那两个数已经真实，所以按 <b>≥1.0 / 0.8 / 0.3</b> 判档；另外 ${estRows} 行标「估」的分子还是推算的，只给<b>组内相对位</b>，不套阈值。` : '')}
      换真值的办法：卖家精灵 / Helium10 里搜同一个词，把「月搜索量」抄进侧栏「手动修改」；亚马逊搜索结果数联网即真值。
      两个数都换成真实的，这张表才有决策价值。</p>

    <p class="pnote"><b>为什么用搜索结果总数当分母：</b>逐款抓前 100 名再数链接，既慢又会漏掉广告位和变体；
      搜索页那一行「1-16 of over N results」本身就是这个细分下的在售总量，误差更小，也更快。</p>`;
}

</script>
<script>
/* =========================================================
   audit.js — 上架体检 · 100 分制（8 维）
   维度与权重取自 GitHub 开源 skill 的 Amazon listing 审计模型
   （nexscope-ai/Amazon-Skills · amazon-listing-optimization）：
     Title 15 / Bullets 15 / Images 15 / A+ 10 / Description 10
     Pricing 10 / Reviews 15 / SEO 10
   开源版靠抓页面 + 大模型判断，这里改成「离线可复算」的版本：
   能算的给实测值，算不了的（图 / A+ / 描述文案）如实标「待核」，不编分。
   ========================================================= */

/* 从词组里删掉核心词：「stainless steel blades portable blender」→「stainless steel blades」 */
function auditStrip(core, s) {
  const v = String(s || '');
  if (!core) return v.trim();
  const re = new RegExp('(^|\\s)' + String(core).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$)', 'ig');
  return v.replace(re, ' ').replace(/\s+/g, ' ').trim();
}

/* ---------- 标题骨架 ----------
   顺序按平台实际权重：核心词打头（前 80 字符内必须出现），
   属性词居中，痛点与场景收尾。核心词重复出现只占字符位，不加权，所以全篇去重。 */
function auditTitle(ctx, kw, lim) {
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const core = String(kw.core || '');
  const rows = kw.rows || [];
  const pick = t => (rows.find(r => r.type === t) || {}).k || '';
  const many = t => rows.filter(r => r.type === t).map(r => r.k);
  const strip = s => auditStrip(core, s);
  const toks = s => String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const seen = {};
  toks(core).forEach(w => { seen[w] = 1; });
  const fresh = s => toks(s).every(w => !seen[w]);   /* 有一个词重复就换下一条 */
  const take = s => { toks(s).forEach(w => { seen[w] = 1; }); return s; };

  const seg = [];
  if (core) seg.push(take(cap(core)));
  const attrs = many('属性词').map(a => strip(a).replace(/^with\s+/i, '')).filter(a => a && fresh(a));
  attrs.slice(0, 2).forEach(a => { if (fresh(a)) seg.push(take(a)); });

  const pain = strip(pick('痛点词')).replace(/^with\s+/i, '');
  const scene = strip(pick('场景词'));
  const tail = [pain, scene].filter(x => x && fresh(x)).join(' ');
  if (tail) seg.push(take(tail));

  /* 超限就从尾巴上砍，砍到合规为止 —— 标题宁可少一个卖点，也不能被截断 */
  let title = seg.join(', ');
  while (title.length > lim.title && seg.length > 1) {
    seg.pop();
    title = seg.join(', ');
  }
  return { title, len: title.length, seg: seg.length };
}

/* 每个词该落在哪：T 标题 / B 五点 / D 描述 / '' 只投广告（不进 listing） */
function auditPlace(r) {
  switch (r.type) {
    case '核心词': case '精准词': return 'TBD';
    case '属性词': return 'TB';
    case '场景词': return 'BD';
    case '实时词': case '长尾词': return 'BD';
    case '痛点词': return 'TD';
    case '竞品词': return '';       /* 商标风险：只能投广告，不能写进 listing */
    default: return 'B';
  }
}

function auditSection(ctx) {
  const pf = (typeof C !== 'undefined' && C.plat) ? C.plat(ctx) : 'Amazon';
  const lim = LIMIT[pf] || LIMIT['还没定'];
  const kw = kwClusters(ctx);
  const { list, st } = hotOf(ctx);
  const sym = mkOf(ctx.market).sym;

  if (!kw.rows || !kw.rows.length) {
    return `<section class="ch" id="audit">
      <h2><i>上架前</i>Listing 体检 · 100 分</h2>
      <div class="stopbox"><b>没有核心词，体检做不了</b><span>这一节的每一项都是拿「目标词 × 你的标题 / 五点」算出来的。产品名还没识别出品类，词簇是空的 —— 先定品类，回来这节会自动重算。</span></div>
    </section>`;
  }

  const rows = kw.rows;
  const T = auditTitle(ctx, kw, lim);
  const core = String(kw.core || '');
  const lc = T.title.toLowerCase();
  const corePos = core ? lc.indexOf(core.toLowerCase()) : -1;
  const STOP = { for: 1, to: 1, with: 1, and: 1, the: 1, a: 1, of: 1, in: 1, on: 1 };
  const tk = x => String(x || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w && !STOP[w]);
  const has = k => {
    const need = tk(k);
    return need.length > 0 && need.every(w => lc.indexOf(w) > -1);
  };

  /* ---------- 1. Title /15 ---------- */
  const over = Math.max(0, T.len - lim.title);
  const sLen = over ? Math.max(0, 6 - Math.ceil(over / 15)) : T.len < 60 ? 3 : T.len < 100 ? 5 : 6;
  const sPos = (corePos > -1 && corePos < 80) ? 4 : 0;
  const tTgt = rows.filter(r => auditPlace(r).indexOf('T') > -1);
  const tHit = tTgt.filter(r => has(r.k));
  const covT = tTgt.length ? tHit.length / tTgt.length : 0;
  const sCov = covT >= .8 ? 3 : covT >= .5 ? 2 : covT > 0 ? 1 : 0;
  const banHit = (typeof BAN !== 'undefined' ? BAN : []).filter(b => new RegExp(b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(T.title));
  const sBan = banHit.length ? 0 : 2;
  const titleScore = sLen + sPos + sCov + sBan;

  /* ---------- 2. Bullets /15 ---------- */
  const pts = (typeof toEn === 'function') ? toEn(ctx.points).filter(Boolean) : [];
  const bPool = rows.filter(r => r.type !== '竞品词' && String(r.k).toLowerCase().indexOf(core.toLowerCase()) > -1);
  const usedW = {};
  const bullets = [];
  for (let i = 0; i < 5; i++) {
    const head = pts[i] || ['premium quality', 'easy to use', 'value pack', 'gift ready', 'worry free'][i];
    const w = bPool.find(x => !usedW[x.k] && (pts[i] ? true : i >= pts.length));
    if (w) usedW[w.k] = 1;
    bullets.push({ head, word: w ? w.k : '' });
  }
  const bWith = bullets.filter(b => b.word).length;
  const sBN = Math.min(6, bullets.length * 1.2);
  const sBW = Math.min(5, bWith);
  /* 利益型开头只有在你真填了卖点时才成立，兜底串不算 */
  const sBH = pts.length >= 3 ? 2 : pts.length >= 1 ? 1 : 0;
  const sBD = (new Set(bullets.map(b => b.word).filter(Boolean)).size === bWith) ? 2 : 1;
  const bulletScore = sBN + sBW + sBH + sBD;

  /* ---------- 5. Pricing /10 ---------- */
  const med = st.med || 30;
  const price = num(ctx.price) || med;
  const gap = (price - med) / med;
  const priceScore = gap <= -0.15 ? 6 : gap <= -0.05 ? 10 : Math.abs(gap) <= 0.05 ? 8 : gap <= 0.12 ? 6 : gap <= 0.25 ? 3 : 1;
  const priceWhy = gap <= -0.15 ? `比中位低 ${pct(-gap)}，是价格武器，但毛利会被压到很薄` :
    gap <= -0.05 ? `比中位低 ${pct(-gap)}，进得来又不至于打穿底价` :
      Math.abs(gap) <= 0.05 ? '贴着中位，只能靠差异而不是价格' :
        `比中位高 ${pct(gap)}，主图必须第一眼看出「贵在哪」，否则没有点击理由`;

  /* ---------- 6. Reviews /15（门槛，不是你的评分） ---------- */
  const top3 = list.slice(0, 3);
  const revMed = top3.length ? top3.map(x => x[4]).sort((a, b) => a - b)[Math.floor(top3.length / 2)] : 0;
  const rateMed = top3.length ? top3.reduce((s, x) => s + x[3], 0) / top3.length : 4.2;
  const revScore = revMed < 500 ? 15 : revMed < 2000 ? 11 : revMed < 10000 ? 6 : 2;
  const revWhy = revMed < 500 ? `头部评论中位 ${revMed.toLocaleString('en-US')} 条，90 天追得上` :
    revMed < 2000 ? `头部评论中位 ${revMed.toLocaleString('en-US')} 条，要准备 6–9 个月的内容与测评` :
      revMed < 10000 ? `头部评论中位 ${revMed.toLocaleString('en-US')} 条，正面拼量没戏，只能靠形态差异` :
        `头部评论中位 ${revMed.toLocaleString('en-US')} 条，存量墙已经封死首屏`;

  /* ---------- 7. SEO /10：标题+五点真正装下多少词 + 有没有堆砌 ---------- */
  const tgtAll = rows.filter(r => r.type !== '竞品词');
  const gotWord = tgtAll.filter(r => has(r.k) || usedW[r.k]).length;
  const covAll = tgtAll.length ? gotWord / tgtAll.length : 0;
  const dupList = (() => {
    const m = {}; toksCount(T.title).forEach(w => { m[w] = (m[w] || 0) + 1; });
    return Object.keys(m).filter(w => m[w] > 1);
  })();
  const dupWords = dupList.length;
  const sSeoC = Math.round(covAll * 8);
  const sSeoD = dupWords === 0 ? 2 : dupWords <= 1 ? 1 : 0;
  const seoScore = sSeoC + sSeoD;

  function toksCount(s) { return String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }

  /* ---------- 合计 ---------- */
  const items = [
    { k: 'Title 标题', w: 15, v: titleScore, real: true, m: `${T.len}/${lim.title} 字符 · 核心词在第 ${corePos > -1 ? corePos : '—'} 字符 · 装下 ${tHit.length}/${tTgt.length} 个必进标题的词${banHit.length ? ' · 违禁词 ' + banHit.join('/') : ''}`, why: over ? `超 ${over} 字符，移动端会被截断` : corePos < 0 ? '标题里找不到核心词，等于没打这个词' : T.len < 60 ? '标题偏短：容量 / 数量 / 材质这些能决定搜索命中的信息还没写进去' : '长度、位置、词密度都在合规区' },
    { k: 'Bullets 五点', w: 15, v: bulletScore, real: true, m: `${bullets.length} 条规划 · ${bWith} 条带词 · ${pts.length} 条卖点可用`, why: pts.length < 3 ? '卖点没填够，五条只能靠兜底串，读者看不出差别' : (bWith < 5 ? `${5 - bWith} 条还没落词，等于白写` : '每条都有词，密度合理') },
    { k: 'Images 主图', w: 15, v: 0, real: false, m: '上传后自核', why: '7 张：白底主图 / 场景 / 细节 / 尺码或对比 / 包装清单 / 15 秒视频 / 卖点信息图' },
    { k: 'A+ 内容', w: 10, v: 0, real: false, m: '品牌备案后自核', why: '5 模块：品牌故事 / 对比表 / 使用场景 / 材质工艺 / 售后承诺' },
    { k: 'Description 描述', w: 10, v: 0, real: false, m: '写完自核', why: '问题 → 方案 → 不适合谁 → 清单，末段再收一次核心词（不超过 2000 字符）' },
    { k: 'Pricing 定价', w: 10, v: priceScore, real: true, m: `${sym}${price} vs 中位 ${sym}${med}`, why: priceWhy },
    { k: 'Reviews 评论', w: 15, v: revScore, real: true, m: `头部中位 ${revMed.toLocaleString('en-US')} 条 · 均分 ${rateMed.toFixed(1)}`, why: revWhy },
    { k: 'SEO 覆盖', w: 10, v: seoScore, real: true, m: `标题+五点装下 ${gotWord}/${tgtAll.length} 个词 · 重复词 ${dupWords}`, why: dupWords > 0 ? `标题里重复了 ${dupWords} 个词，占字符位但不加权` : covAll < .6 ? `还有 ${tgtAll.length - gotWord} 个词没进标题或五点，投出去也搜不到你` : '词基本都有落位，也没有堆砌' }
  ];
  const got = items.filter(i => i.real).reduce((s, i) => s + i.v, 0);
  const full = items.filter(i => i.real).reduce((s, i) => s + i.w, 0);
  const wait = items.filter(i => !i.real);
  const rate = full ? got / full : 0;
  const grade = rate >= .9 ? ['结构已经能上架', 'good'] : rate >= .75 ? ['补齐一处就能上', 'mid'] : rate >= .55 ? ['结构有缺口', 'mid'] : ['先重写再谈投放', 'bad'];
  const mark = i => i.real ? `<b>${Math.round(i.v)}</b><em>/${i.w}</em>` : `<b class="sr-est">—</b><em>待核</em>`;

  /* 覆盖矩阵 */
  const matRows = rows.map(r => {
    const p = auditPlace(r);
    const inT = has(r.k), inB = !!usedW[r.k], inD = p.indexOf('D') > -1;
    const cell = ok => ok ? '<td class="ok">✓</td>' : '<td class="no">—</td>';
    const note = !p ? '只投广告 · 商标风险，不进 listing'
      : (inT || inB) ? '已装下'
        : inD ? '待写进描述' : '待排位';
    return `<tr>
      <td>${esc(r.k)}</td>
      <td><span class="tg tg-${r.type === '核心词' ? 'b' : r.type === '痛点词' ? 'r' : 'y'}">${r.type}</span></td>
      ${cell(inT)}${cell(inB)}${cell(inD)}
      <td class="sub2">${note}</td>
    </tr>`;
  }).join('');

  /* 补分建议：按得分率最低的三项 */
  const weak = items.filter(i => i.real && i.v < i.w).sort((a, b) => (a.v / a.w) - (b.v / b.w)).slice(0, 3);
  const FIX = {
    'Title 标题': over
      ? `砍到 ${lim.title} 字符内：先删重复词，再删形容词，规格和核心词不能动`
      : (corePos < 0 ? `核心词「${core}」必须写进标题，而且要在前 80 字符 —— 移动端只显示这一段` : `标题还差 ${tTgt.length - tHit.length} 个必进词：${tTgt.filter(r => !has(r.k)).slice(0, 3).map(r => auditStrip(core, r.k)).join(' / ')}`),
    'Bullets 五点': pts.length < 3
      ? '侧栏「核心卖点」填够 3 条：五点的开头必须是利益短语，兜底串写出来没人看'
      : '每条开头大写利益短语，句子里自然带一个词，别在结尾堆词',
    'Pricing 定价': `定价落在 ${sym}${Math.round(med * 0.9)}–${sym}${Math.round(med * 1.02)}：低于中位但不打穿底价`,
    'Reviews 评论': '首月不追销量追评分：前 20 条评论决定后续转化；把差评高频词做成五点和 FAQ，等于提前拆掉对手的弹药',
    'SEO 覆盖': dupWords > 0 ? `标题里「${dupList.join(' / ')}」重复了，删掉重复的那一处，把字符让给规格` : '每个词只安排一个主战场：标题拿曝光、五点拿转化、描述收长尾'
  };
  const fixHtml = weak.length ? weak.map((i, n) => `
    <div class="afix">
      <div class="afix-n">${n + 1}</div>
      <div class="afix-b">
        <b>${esc(i.k)} · 丢 ${Math.round(i.w - i.v)} 分</b>
        <span>${esc(FIX[i.k] || '按上面的实测值逐条补齐')}</span>
      </div>
    </div>`).join('') : '<p class="pnote">能核的五项全部达标，剩下三项要你上传后自己打勾。</p>';

  return `<section class="ch" id="audit">
    <h2><i>上架前</i>Listing 体检 · 100 分</h2>
    <p class="plead">前面五章决定「做不做」，这一节决定「上架那天能不能直接起量」。八个维度、100 分，权重按平台实际影响排 ——
      <b>标题、五点、评论各 15 分</b>，因为那是买家唯一会读完、也唯一会用来判断你的三块。
      其中<b>图、A+、描述文案</b>要你上传或写完才能核，这里只给清单、不编分：三项共 35 分单列，不进分母。</p>

    <div class="audit-top ${grade[1]}">
      <div class="audit-num">
        <b>${Math.round(got)}</b><em>/${full}</em>
        <span>已核得分 · 折算 ${Math.round(rate * 100)}/100</span>
      </div>
      <div class="audit-t">
        <b>${grade[0]}</b>
        <span>${wait.length} 项共 ${wait.reduce((s, i) => s + i.w, 0)} 分需自核（${wait.map(i => i.k.split(' ')[0]).join(' / ')}），未计入分母。分数只说明「结构对不对」，不预测销量 —— 结构对但选错品，照样卖不动。</span>
      </div>
    </div>

    <div class="tw">
      <table class="stab atab">
        <colgroup><col style="width:100px"><col style="width:34px"><col style="width:34%"><col style="width:52px"><col></colgroup>
        <thead><tr><th>维度</th><th>权重</th><th>实测</th><th>得分</th><th>判断依据</th></tr></thead>
        <tbody>
          ${items.map(i => `<tr class="${i.real ? '' : 'sr-est'}">
            <td><b>${esc(i.k)}</b></td>
            <td>${i.w}</td>
            <td>${esc(i.m)}</td>
            <td class="audit-s">${mark(i)}</td>
            <td class="sub2">${esc(i.why)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <h3>标题骨架（可直接改）</h3>
    <div class="draft">
      <div class="draft-t">${esc(T.title)}</div>
      <div class="draft-m">${T.len} / ${lim.title} 字符 · 核心词在第 ${corePos > -1 ? corePos : '—'} 字符 · 共 ${T.seg} 段 · ${pf}</div>
    </div>

    <h3>埋词覆盖矩阵</h3>
    <p class="fx2">开源版靠抓页面 + 大模型逐词比对，这里换成「先把每个词安排到唯一位置，再查有没有漏」。
      <b>✓ 标题 / 五点 = 当前的骨架里已经装下，✓ 描述 = 排给描述去收</b>。一张表就能看出哪些词还悬着。</p>
    <div class="tw">
      <table class="stab amat">
        <thead><tr><th>关键词</th><th>类型</th><th>标题</th><th>五点</th><th>描述</th><th>说明</th></tr></thead>
        <tbody>${matRows}</tbody>
      </table>
    </div>

    <h3>最该补的三处</h3>
    <div class="afixs">${fixHtml}</div>

    <p class="pnote">方法来源：维度与权重取自 GitHub 开源 skill <b>nexscope-ai/Amazon-Skills</b> 的 amazon-listing-optimization（Title 15 / Bullets 15 / Images 15 / A+ 10 / Description 10 / Pricing 10 / Reviews 15 / SEO 10）。
      原版依赖抓页面与模型判断，本节改为用本地词簇、价格带、头部评论量复算；<b>算不出的三项如实留空</b>。
      评论那一项的口径是「门槛」而不是你的评分 —— 上架前你还没有评分，能判断的只有这道墙有多高。</p>
  </section>`;
}

</script>
<script>
/* =========================================================
   crawler.js — 附录：联网抓评论
   页面不能自己跨域抓亚马逊，所以给一个本地抓取桥：
     scripts/amazon_bridge.py  （同时是 HTTP 服务 与 命令行工具）
       --serve      → 起 http://127.0.0.1:8765 ，页面点「联网抓取」直接用
